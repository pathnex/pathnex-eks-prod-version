apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pathnex
  template:
    metadata:
      labels:
        app: pathnex
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: pathnex
  namespace: nginx
spec:
  selector:
    app: pathnex
  ports:
    - port: 80
      targetPort: 80
